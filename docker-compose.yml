name: student-StudyBuddyHub

services:

  # ── PostgreSQL 17 ────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: student-hororoi-db
    environment:
      POSTGRES_DB: StudyBuddyHubDb
      POSTGRES_USER: sbh
      POSTGRES_PASSWORD: "StudyBuddy@2024!"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbh -d StudyBuddyHubDb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [studlab_net]
    restart: unless-stopped

  # ── .NET 10 REST API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: StudyBuddyHub.Api/Dockerfile
    container_name: student-hororoi-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=student-hororoi-db;Port=5432;Database=StudyBuddyHubDb;Username=sbh;Password=StudyBuddy@2024!"
      Jwt__Key: "superSecretKey@345superSecretKey@345"
      Jwt__Issuer: "StudyBuddyHub"
      Jwt__Audience: "StudyBuddyHub"
      FrontendUrl: "https://StudyBuddyHub.student-dev.ro"
    expose: ["8080"]                    # NU ports: — nginx-ul cursului face routing-ul
    depends_on:
      db:
        condition: service_healthy
    networks: [studlab_net]
    restart: unless-stopped

  # ── Angular 19 + Nginx ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./study-buddy-hub-frontend
      dockerfile: Dockerfile
    container_name: student-hororoi-frontend
    expose: ["80"]                      # NU ports: — nginx-ul cursului face routing-ul
    depends_on: [api]
    networks: [studlab_net]
    restart: unless-stopped

volumes:
  db_data:

networks:
  studlab_net:
    external: true
    name: studlab_net

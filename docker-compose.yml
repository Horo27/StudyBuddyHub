services:

  # ── PostgreSQL 17 (~100MB RAM vs ~1.5GB pentru SQL Server) ──────────────────
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: StudyBuddyHubDb
      POSTGRES_USER: sbh
      POSTGRES_PASSWORD: "StudyBuddy@2024!"   # change in production
    # portul 5432 nu e expus pe host — API-ul se conectează intern prin rețeaua Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbh -d StudyBuddyHubDb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s                 # Postgres pornește în ~5s

  # ── .NET 10 REST API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .                        # solution root (needs all 3 projects)
      dockerfile: StudyBuddyHub.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Connection string — overrides the LocalDB default in appsettings.json
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=StudyBuddyHubDb;Username=sbh;Password=StudyBuddy@2024!"
      # JWT settings — change Jwt__Key to a long random secret in production!
      Jwt__Key: "superSecretKey@345superSecretKey@345"
      Jwt__Issuer: "StudyBuddyHub"
      Jwt__Audience: "StudyBuddyHub"
      # CORS — must match the origin the browser uses to reach the frontend
      FrontendUrl: "http://localhost:8080"
    ports:
      - "5117:8080"                     # also reachable directly for testing / Swagger
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure                 # retry if DB wasn't ready on first attempt

  # ── Angular 19 + Nginx ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./study-buddy-hub-frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"                       # http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:                               # persists DB data across container restarts

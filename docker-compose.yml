name: student-StudyBuddyHub

services:

  # ── PostgreSQL 17 ────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: student-hororoi-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [studlab_net]
    restart: unless-stopped

  # ── .NET 10 REST API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: StudyBuddyHub.Api/Dockerfile
    container_name: student-hororoi-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=student-hororoi-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      FrontendUrl: ${FRONTEND_URL}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
    expose: ["8080"]
    depends_on:
      db:
        condition: service_healthy
    networks: [studlab_net]
    restart: unless-stopped

  # ── Angular 19 + Nginx ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./study-buddy-hub-frontend
      dockerfile: Dockerfile
    container_name: student-hororoi-frontend
    expose: ["80"]
    depends_on: [api]
    networks: [studlab_net]
    restart: unless-stopped

volumes:
  db_data:

networks:
  studlab_net:
    external: true
    name: studlab_net

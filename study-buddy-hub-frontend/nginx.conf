server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Proxy API requests spre containerul .NET
    location /api/ {
        proxy_pass         http://student-hororoi-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Angular SPA routing — toate rutele necunoscute merg la index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching pentru index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # Cache agresiv pentru assets statice cu hash (js, css, fonturi, imagini)
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires            1y;
        add_header Cache-Control "public, immutable";
    }
}

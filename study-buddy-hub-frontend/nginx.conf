server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Proxy /api/* → .NET API container ────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Angular SPA routing ───────────────────────────────────────────────────
    # All unknown paths fall back to index.html so the Angular router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching for index.html — ensures users always get the latest app version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # Aggressive caching for hashed static assets (Angular appends content hashes)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires            1y;
        add_header Cache-Control "public, immutable";
    }
}
